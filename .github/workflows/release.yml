name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag version (e.g. 0.1.1)"
        required: true
        default: "0.1.1"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      NOTARY_PROFILE: halo-notary
      TEAM_ID: UF272HL6P5
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$INPUT_VERSION
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check out the tagged app source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ env.VERSION }}
          path: release-source
          persist-credentials: false

      - name: Configure signing and notarization
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          API_KEY: ${{ secrets.ASC_API_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?Missing DEVELOPER_ID_P12_BASE64}" "${CERTIFICATE_PASSWORD:?Missing DEVELOPER_ID_P12_PASSWORD}"
          : "${API_KEY:?Missing ASC_API_KEY_P8}" "${KEY_ID:?Missing ASC_KEY_ID}" "${ISSUER_ID:?Missing ASC_ISSUER_ID}"
          umask 077
          keychain="$RUNNER_TEMP/halo-signing.keychain-db"
          cert="$RUNNER_TEMP/halo.p12"
          api="$RUNNER_TEMP/halo.p8"
          trap 'rm -f "$cert" "$api"' EXIT
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 -D > "$cert"
          security import "$cert" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -v team="($TEAM_ID)\"" '/"Developer ID Application:/ && index($0, team) {print $2}')
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || { echo "Expected one Developer ID Application identity for $TEAM_ID"; exit 1; }
          printf '%s\n' "$API_KEY" > "$api"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$keychain" --key "$api" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign, notarize and verify release artifacts
        run: |
          cp scripts/{build-app,package-dmg,notarize}.sh release-source/scripts/
          cd release-source
          ./scripts/build-app.sh
          ./scripts/package-dmg.sh
          cd build
          shasum -a 256 -c SHA256SUMS.txt
          ditto -x -k "halo-v$VERSION-arm64.zip" "$RUNNER_TEMP/halo-zip"
          xcrun stapler validate "$RUNNER_TEMP/halo-zip/halo.app"
          spctl --assess --type execute "$RUNNER_TEMP/halo-zip/halo.app"

      - name: Publish verified artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: ${{ github.event_name == 'push' }}
          fail_on_unmatched_files: true
          files: |
            release-source/build/halo-v${{ env.VERSION }}-arm64.dmg
            release-source/build/halo-v${{ env.VERSION }}-arm64.zip
            release-source/build/SHA256SUMS.txt

      - name: Clean up signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/halo-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
