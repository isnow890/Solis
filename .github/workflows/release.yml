name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          else
            VER="${INPUT_VERSION}"
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & Package Solis.app
        env:
          CODESIGN_IDENTITY: "-"
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x scripts/build-app.sh scripts/package-dmg.sh
          ./scripts/build-app.sh
          ./scripts/package-dmg.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Solis ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            build/Solis-v${{ steps.meta.outputs.version }}-*.dmg
            build/Solis-v${{ steps.meta.outputs.version }}-*.zip
            build/SHA256SUMS.txt
